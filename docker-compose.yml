# Infrastructure locale : MySQL (un schéma par service), Mailpit (boîte mail de démo), Adminer.
# Ports publiés sur 127.0.0.1 uniquement. Chaque valeur est surchargeable par variable d'environnement.
name: soa-stages

services:
  mysql:
    image: mysql:8.4
    container_name: soa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-soa_root_2026}
      SOA_DB_PASSWORD: ${SOA_DB_PASSWORD:-soa_dev_2026}
      TZ: ${SOA_FUSEAU:-Africa/Casablanca}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${SOA_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Passe par TCP : le serveur temporaire de l'initialisation n'écoute que sur le socket,
    # donc ce contrôle ne réussit qu'une fois tous les scripts de db/init exécutés.
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e \"SELECT 1 FROM soa_portail.compte LIMIT 1\" > /dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: soa-mailpit
    restart: unless-stopped
    environment:
      TZ: ${SOA_FUSEAU:-Africa/Casablanca}
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  adminer:
    image: adminer:4.8.1
    container_name: soa-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8088}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
