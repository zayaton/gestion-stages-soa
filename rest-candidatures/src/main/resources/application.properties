# S4 Gestion des candidatures. Surchargeable par variable d'environnement (voir common/Configuration).
candidatures.port=8084
candidatures.db.schema=soa_candidatures
candidatures.db.utilisateur=svc_candidatures

# Orchestration du processus de candidature : bonita (référence : le processus BPMN déployé dans Bonita orchestre)
# ou direct (mêmes étapes exécutées en Java : secours pour le développement et les tests automatiques).
# Variable d'environnement : ORCHESTRATION_MODE. Au démarrage : .\scripts\start-all.ps1 -Orchestration direct
orchestration.mode=bonita

# Règle R6 : nombre maximal de candidatures actives (DEPOSEE et EN_COURS_EVALUATION) par étudiant.
candidatures.limite.actives=5
# Destinataire des alertes du processus (gestion d'erreurs).
candidatures.responsable.email=responsable@inpt.ac.ma
# Étape 9 : le stage créé commence ce nombre de jours après l'acceptation ; sa durée est celle de l'offre.
candidatures.stage.debut.jours=30

# Mode bonita : API REST de Bonita Studio (Tomcat sur 8080), processus déployé et compte technique.
# Le compte doit pouvoir démarrer le processus et être candidat de la tâche « Décision de l'entreprise »
# (correspondance des acteurs : docs/bonita/GUIDE_BONITA.md).
bonita.url=http://localhost:8080/bonita
bonita.utilisateur=walter.bates
bonita.motdepasse=bpm
bonita.processus.nom=Candidature
bonita.processus.version=1.0
bonita.tache.decision=Décision de l'entreprise
