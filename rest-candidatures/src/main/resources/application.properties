# S4 Gestion des candidatures. Surchargeable par variable d'environnement (voir common/Configuration).
candidatures.port=8084
candidatures.db.schema=soa_candidatures
candidatures.db.utilisateur=svc_candidatures

# Orchestration du processus de candidature : direct (étapes exécutées en Java) ou bonita.
# Variable d'environnement : ORCHESTRATION_MODE.
orchestration.mode=direct

# Règle R6 : nombre maximal de candidatures actives (DEPOSEE et EN_COURS_EVALUATION) par étudiant.
candidatures.limite.actives=5
# Destinataire des alertes du processus (gestion d'erreurs).
candidatures.responsable.email=responsable@inpt.ac.ma
# Étape 9 : le stage créé commence ce nombre de jours après l'acceptation ; sa durée est celle de l'offre.
candidatures.stage.debut.jours=30
