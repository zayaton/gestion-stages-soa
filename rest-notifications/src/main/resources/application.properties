# S5 Notifications. Surchargeable par variable d'environnement (voir common/Configuration).
notifications.port=8085
notifications.db.schema=soa_notifications
notifications.db.utilisateur=svc_notifications

# Envoi des courriels : Mailpit en démonstration (http://localhost:8025 pour les lire).
notifications.smtp.hote=localhost
notifications.smtp.port=1025
notifications.smtp.delai.ms=5000
notifications.expediteur.adresse=ne-pas-repondre@stages.inpt.ac.ma
notifications.expediteur.nom=Plateforme des stages INPT

# Rappels de date limite : chaque jour à l'heure indiquée (fuseau soa.fuseau), pour les offres qui ferment dans N jours.
notifications.rappels.actif=true
notifications.rappels.heure=08:00
notifications.rappels.jours=3
